# .github/workflows/release.yml
# A pull request that changes the model is scored first. After a merge to main the
# model is registered as a new version, and a person approves it before it is
# deployed to the endpoint.
name: Release the model

on:
  pull_request:               # every pull request, so the required gate check always reports
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0              # the gate reads the model on main out of Git

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the model library
        run: pip install xgboost==1.7.6 numpy

      - name: Score the candidate against the model on main
        run: python release/gate.py

  register:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.register.outputs.version }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Register the model as a new version
        id: register
        run: release/register.sh

  deploy:
    needs: register
    runs-on: ubuntu-latest
    environment: production           # a reviewer approves here, before anything is deployed
    concurrency: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Approve the version and deploy it
        run: release/deploy.sh ${{ needs.register.outputs.version }}

      - name: Check the live endpoint on 1,000 known bookings
        run: release/check_live.sh
