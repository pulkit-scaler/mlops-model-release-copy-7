# .github/workflows/rollback.yml
# Put the endpoint back on an earlier registered version. Started by hand from the
# Actions tab. No gate and no new version: the version was approved once already.
name: Roll back the model

on:
  workflow_dispatch:
    inputs:
      version:
        description: Registry version number to go back to
        required: true

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    permissions:
      id-token: write
      contents: read
    env:
      # Typed text goes through an environment variable, never straight into a script.
      VERSION: ${{ inputs.version }}
      REJECT_PREVIOUS: "1"
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Deploy that version again
        run: release/deploy.sh "$VERSION"

      - name: Check the live endpoint on 1,000 known bookings
        run: release/check_live.sh
